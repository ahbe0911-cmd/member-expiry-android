name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'member-expiry-phase5.zip'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: 'Run Room and Compose tests on Android emulator'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-source:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Import the verified project archive
        id: source
        shell: bash
        run: |
          set -euo pipefail
          archive=member-expiry-phase5.zip
          if [[ -f "$archive" && ! -f app/build.gradle.kts ]]; then
            echo "a6680f89cab6db65daa581b0e9243d230ebe74e36d1aedbb442d565260e085ce  $archive" | sha256sum -c -
            python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          from stat import S_ISLNK
          with ZipFile("member-expiry-phase5.zip") as z:
              for entry in z.infolist():
                  p = PurePosixPath(entry.filename)
                  if p.is_absolute() or ".." in p.parts or ".git" in p.parts or S_ISLNK(entry.external_attr >> 16):
                      raise ValueError("Unsafe archive entry")
                  if p.parts[0] == ".github" or entry.is_dir():
                      continue
                  target = Path(*p.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
          PY
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "Import verified MemberExpiry v1.0.0 project"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: always() && (needs.import-source.result == 'success' || needs.import-source.result == 'skipped')
    needs: import-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.import-source.outputs.source_sha || github.sha }}
      - name: Verify source exists
        run: test -f app/build.gradle.kts
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Generate official Gradle Wrapper if absent
        shell: bash
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar || ! -f gradlew || ! -f gradlew.bat || ! -f gradle/wrapper/gradle-wrapper.properties ]]; then
            gradle --no-daemon wrapper --gradle-version 8.13 --distribution-type bin
          fi
      - name: Verify and build Debug
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Build Release (signed when configured)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          RELEASE_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            umask 077
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/member-expiry-release.jks"
            trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_PATH"
          fi
          gradle --no-daemon :app:assembleRelease
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          fi
      - name: Verify Debug APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MemberExpiry-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MemberExpiry-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Gradle-Wrapper-8.13
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14

  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.run_device_tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MemberExpiry-Device-Test-Reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
